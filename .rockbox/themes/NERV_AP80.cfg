# NERV AP80 Pro Max | 360 x 640
# Original NERV by EppsNL (CC-BY-SA); credits and notices in CREDITS.md.
wps: /.rockbox/wps/NERV_AP80.wps
sbs: /.rockbox/wps/NERV_AP80.sbs
fms: -
iconset: /.rockbox/icons/NERV.bmp
viewers iconset: /.rockbox/icons/NERV_viewer.bmp
font: /.rockbox/fonts/22-KodeMonoMPlus2-SemiBold.fnt
background color: 000000
foreground color: 00e5ff
backdrop: -
filetype colours: -
show icons: on
selector type: bar (inverse)
scrollbar: off
time format: 24hour
# 50 px list rows (24 px font + 26 px padding): the eight-item main
# menu still fits the list viewport without scrolling, and shorter
# menus (5-6 items) fill the screen properly instead of sitting in a
# compressed block at the top.
list padding: 26
